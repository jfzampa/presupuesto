<meta name="theme-color" content="#2563eb">
<title>Alcanza</title>
<style>
:root{--bg:#f3f6fc;--card:#fff;--tx:#0f172a;--mu:#64748b;--ln:#e2e8f0;--ac:#2563eb;--ok:#16a34a;--no:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#131c2e;--tx:#f1f5f9;--mu:#94a3b8;--ln:#24324a;--ac:#4f8cff}}
*{box-sizing:border-box}
body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--tx);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{position:sticky;top:0;background:var(--bg);padding:12px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--ln);z-index:5}
header h1{font-size:18px;margin:0;flex:1}
main{padding:12px 16px 90px}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
.mu{color:var(--mu);font-size:13px}
.big{font-size:22px;font-weight:700}
button{font:inherit;border:0;border-radius:10px;padding:10px 14px;background:var(--ac);color:#fff;font-weight:600}
button.s{background:var(--card);color:var(--tx);border:1px solid var(--ln)}
button.d{background:var(--no)}
input,select{font:inherit;width:100%;padding:11px;border:1px solid var(--ln);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0 10px}
label{font-size:13px;color:var(--mu)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.ok{background:var(--ok)}.no{background:var(--no)}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom));border-radius:99px;padding:14px 20px;box-shadow:0 4px 14px #0004}
.modal{position:fixed;inset:0;background:#0007;display:flex;align-items:flex-end;z-index:9}
.sheet{background:var(--bg);width:100%;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
.bar{height:8px;background:var(--ln);border-radius:9px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--ac)}
.chk{display:flex;align-items:center;gap:8px;margin-bottom:12px}.chk input{width:auto;margin:0}
.lbl{font-size:12px;font-weight:700;color:var(--mu);margin:14px 0 6px;text-transform:uppercase}
.hero{text-align:center;padding:28px 0 18px}.hero h2{margin:10px 0 2px;font-size:28px;letter-spacing:-.5px}
.bh{display:flex;align-items:center;gap:8px}
.kpi{background:linear-gradient(135deg,#1d4ed8,#4f8cff);box-shadow:0 8px 20px #2563eb33;color:#fff;border-radius:16px;padding:16px;margin-bottom:12px}
.kpi .l{font-size:13px;opacity:.85}.kpi .v{font-size:30px;font-weight:700;margin:2px 0 10px}
.kpi .r{display:flex;gap:18px}.kpi .r b{display:block;font-size:16px}
.offb{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);background:#b45309;color:#fff;text-align:center;font-size:12px;padding:4px 8px;z-index:20}.offb[hidden]{display:none}
.pop{position:fixed;inset:0;z-index:15}
.pop>div{position:absolute;right:12px;top:calc(env(safe-area-inset-top,0px) + 62px);min-width:240px;background:var(--card);border:1px solid var(--ln);border-radius:14px;box-shadow:0 8px 28px #0004;padding:6px}
.pop button{width:100%;text-align:left;background:none;color:var(--tx);border-radius:10px;padding:12px;display:flex;justify-content:space-between;align-items:center;font-weight:500}
.pop button:active{background:var(--bg)}
.pop hr{border:0;border-top:1px solid var(--ln);margin:4px 0}
.card{box-shadow:0 1px 3px #0f172a12}header{backdrop-filter:blur(12px)}
.bdg{position:absolute;top:5px;right:5px;width:9px;height:9px;border-radius:50%;background:var(--no)}.bdg[hidden]{display:none}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:12px;right:12px;background:var(--tx);color:var(--bg);padding:12px 14px;border-radius:12px;z-index:30;box-shadow:0 8px 24px #0004;font-size:14px}
</style>
</head>
<body>
<header id="hd"></header>
<main id="app"></main>
<div id="off" class="offb" hidden>📴 Sin conexión · mostrando lo último guardado (solo lectura)</div>
<div id="modal"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
<script>
const SUPABASE_URL = "https://azaeasfifcamwqqlfztb.supabase.co";
const SUPABASE_KEY = "sb_publishable_4__2tHY6qNwif2xQNg6sKw_TtnZE6X2";

// Sin conexión: se guarda la última respuesta de cada consulta para poder consultarla sin señal
const cfetch = async (url, opts) => {
  const u = String(url);
  if ((!opts || !opts.method || opts.method === "GET") && u.includes("/rest/v1/")) {
    const key = "alc:" + (new Headers(opts && opts.headers).get("Accept") || "") + u;
    try {
      const r = await fetch(url, opts);
      if (r.ok) { try { localStorage.setItem(key, await r.clone().text()); } catch (e) {} }
      return r;
    } catch (e) {
      const c = localStorage.getItem(key);
      if (c == null) throw e;
      const b = document.getElementById("off"); if (b) b.hidden = false;
      return new Response(c, { status: 200, headers: { "Content-Type": "application/json" } });
    }
  }
  return fetch(url, opts);
};

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { global: { fetch: cfetch } });
const S = { cats: [], pris: [], proys: [], p: null, regs: [], f: { q: "", c: "", p: "", e: "" } };
const $ = id => document.getElementById(id);
const mm = (n, c) => new Intl.NumberFormat("es-AR", { style: "currency", currency: c || "ARS", maximumFractionDigits: 0 }).format(n || 0);
const money = n => mm(n, S.p?.moneda);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fail = e => { if (e) { const m = e.message || String(e); alert(/fetch|network|Load failed/i.test(m) ? "Sin conexión: por ahora solo podés consultar tus datos. Probá de nuevo cuando tengas señal." : m); return true; } };

const logo = (n = 40) => `<svg width="${n}" height="${n}" viewBox="0 0 48 48" aria-hidden="true"><rect width="48" height="48" rx="12" fill="#2563eb"/><path d="M13 21l7 7 15-15" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><rect x="12" y="35" width="24" height="4" rx="2" fill="#fff" opacity=".4"/><rect x="12" y="35" width="16" height="4" rx="2" fill="#fff"/></svg>`;

async function init() {
  const { data } = await db.auth.getSession().catch(() => ({ data: {} }));
  if (recuperando) return nuevaClave();
  (data.session || (!navigator.onLine && localStorage.getItem("alc_uid"))) ? await home() : login();
}

let recuperando = false;
db.auth.onAuthStateChange(ev => { if (ev === "PASSWORD_RECOVERY") { recuperando = true; nuevaClave(); } });
const base = () => location.origin + location.pathname;
const msgErr = m => /Invalid login/i.test(m) ? "Email o contraseña incorrectos."
  : /already registered/i.test(m) ? "Ese email ya tiene una cuenta. Probá ingresar."
  : /not confirmed/i.test(m) ? "Todavía no confirmaste tu email. Revisá tu correo."
  : /Password should/i.test(m) ? "La contraseña debe tener al menos 6 caracteres."
  : /rate limit|security purposes/i.test(m) ? "Demasiados intentos. Esperá un minuto y probá de nuevo."
  : /anonymous/i.test(m) ? "Completá email y contraseña." : m;

function login(modo = "in", aviso = "", ok = true) {
  const up = modo === "up", rec = modo === "rec";
  $("hd").innerHTML = `<h1 class="bh">${logo(26)}Alcanza</h1>`;
  $("app").innerHTML = `<div class="hero">${logo(72)}<h2>Alcanza</h2><p class="mu">Decidí qué comprar y qué esperar</p></div><div class="card">
  ${rec ? `<h3 style="margin:0 0 4px">Recuperar contraseña</h3><p class="mu">Te enviamos un enlace al email para elegir una nueva.</p>`
    : `<div class="row" style="margin-bottom:12px"><button class="grow ${up ? "s" : ""}" id="t1">Ingresar</button><button class="grow ${up ? "" : "s"}" id="t2">Crear cuenta</button></div>`}
  <label>Email</label><input id="em" type="email" inputmode="email" autocapitalize="none" autocomplete="email">
  ${rec ? "" : `<label>Contraseña</label><input id="pw" type="password" autocomplete="${up ? "new-password" : "current-password"}">`}
  ${up ? `<label>Repetir contraseña</label><input id="p2" type="password" autocomplete="new-password"><p class="mu" style="margin:-4px 0 10px">Mínimo 6 caracteres.</p>` : ""}
  ${rec ? "" : `<div class="chk"><input id="vp" type="checkbox"><label for="vp" style="font-size:14px">Mostrar contraseña</label></div>`}
  <p id="msg" style="min-height:20px;margin:0 0 10px;font-size:14px"></p>
  <button style="width:100%" id="go">${rec ? "Enviar enlace" : up ? "Crear mi cuenta" : "Ingresar"}</button>
  ${rec ? `<button class="s" style="width:100%;margin-top:8px" id="vb">Volver</button>` : up ? "" : `<p style="text-align:center;margin:12px 0 0"><a href="#" id="fg" style="color:var(--ac)">Olvidé mi contraseña</a></p>`}</div>`;
  const say = (t, good) => { $("msg").style.color = good ? "var(--ok)" : "var(--no)"; $("msg").textContent = t; };
  if (aviso) say(aviso, ok);
  if ($("t1")) { $("t1").onclick = () => login("in"); $("t2").onclick = () => login("up"); }
  if ($("fg")) $("fg").onclick = e => { e.preventDefault(); login("rec"); };
  if ($("vb")) $("vb").onclick = () => login("in");
  if ($("vp")) $("vp").onchange = () => ["pw", "p2"].forEach(i => $(i) && ($(i).type = $("vp").checked ? "text" : "password"));
  document.querySelectorAll("#app input").forEach(i => i.onkeydown = e => { if (e.key === "Enter") $("go").click(); });
  $("go").onclick = async () => {
    const email = $("em").value.trim(), pw = $("pw")?.value || "";
    if (!/^\S+@\S+\.\S+$/.test(email)) return say("Escribí un email válido.");
    if (!rec && !pw) return say("Escribí tu contraseña.");
    if (up && pw.length < 6) return say("La contraseña debe tener al menos 6 caracteres.");
    if (up && pw !== $("p2").value) return say("Las contraseñas no coinciden.");
    const b = $("go"), txt = b.textContent; b.disabled = true; b.textContent = "Un momento…";
    try {
      if (rec) {
        const { error } = await db.auth.resetPasswordForEmail(email, { redirectTo: base() });
        error ? say(msgErr(error.message)) : say("Si el email existe, te enviamos un enlace. Revisá tu correo.", true);
      } else if (up) {
        const { data, error } = await db.auth.signUp({ email, password: pw, options: { emailRedirectTo: base() } });
        if (error) say(msgErr(error.message));
        else if (data.session) await home();
        else if (data.user && data.user.identities && data.user.identities.length === 0) say("Ese email ya tiene una cuenta. Probá ingresar.");
        else login("in", "✅ Cuenta creada. Te enviamos un correo: confirmalo y después ingresá.", true);
      } else {
        const { error } = await db.auth.signInWithPassword({ email, password: pw });
        error ? say(msgErr(error.message)) : await home();
      }
    } finally { if ($("go")) { b.disabled = false; b.textContent = txt; } }
  };
}

function nuevaClave() {
  $("hd").innerHTML = `<h1 class="bh">${logo(26)}Alcanza</h1>`;
  $("app").innerHTML = `<div class="hero">${logo(72)}<h2>Nueva contraseña</h2><p class="mu">Elegí una contraseña nueva para tu cuenta</p></div><div class="card">
  <label>Contraseña nueva</label><input id="n1" type="password" autocomplete="new-password">
  <label>Repetir contraseña</label><input id="n2" type="password" autocomplete="new-password">
  <p id="msg" style="min-height:20px;margin:0 0 10px;font-size:14px;color:var(--no)"></p><button style="width:100%" id="go">Guardar y entrar</button></div>`;
  $("go").onclick = async () => {
    const a = $("n1").value;
    if (a.length < 6) return $("msg").textContent = "Mínimo 6 caracteres.";
    if (a !== $("n2").value) return $("msg").textContent = "Las contraseñas no coinciden.";
    const { error } = await db.auth.updateUser({ password: a });
    if (error) return $("msg").textContent = msgErr(error.message);
    recuperando = false; home();
  };
}

async function loadCats(pid) {
  const [c, p] = await Promise.all([db.from("categoria").select("*").eq("proyecto_id", pid).order("orden"), db.from("prioridad").select("*").eq("proyecto_id", pid).order("nivel")]);
  if (fail(c.error) || fail(p.error)) return;
  S.cats = c.data; S.pris = p.data;
}

async function home() {
  S.uid = (await db.auth.getSession().catch(() => ({ data: {} }))).data.session?.user.id || localStorage.getItem("alc_uid");
  if (S.uid) localStorage.setItem("alc_uid", S.uid);
  S.perfil = (await db.from("perfil").select("*").maybeSingle()).data || {};
  const { data, error } = await db.from("proyecto").select("*").eq("activo", true).order("fecha_creado", { ascending: false });
  if (fail(error)) return;
  const bj = ((await db.from("bandeja").select("id").eq("activo", true)).data || []).length;
  S.proys = data; S.p = null; S.bj = bj;
  const mem = {}; ((await db.from("proyecto_miembro").select("proyecto_id")).data || []).forEach(m => mem[m.proyecto_id] = 1); S.f = { q: "", c: "", p: "", e: "" };
  const rg = data.length ? (await db.from("registro").select("proyecto_id,valor,comprado").eq("activo", true).in("proyecto_id", data.map(p => p.id))).data || [] : [];
  const st = {}; rg.forEach(r => { const o = st[r.proyecto_id] ||= { n: 0, g: 0 }; o.n++; if (r.comprado) o.g += Number(r.valor); });
  const mon = {}; data.forEach(p => { const c = p.moneda || "ARS", o = mon[c] ||= { tp: 0, tg: 0 }; o.tp += Number(p.valor_inicial); o.tg += st[p.id]?.g || 0; });
  $("hd").innerHTML = `<h1 class="bh">${logo(26)}Mis proyectos</h1><button class="s" id="bl" aria-label="Avisos" style="position:relative">🔔<span class="bdg" id="bn" hidden></span></button><button class="s" id="mn" aria-label="Menú">☰${bj ? ` <span class="tag" style="background:var(--no)">${bj}</span>` : ""}</button><button class="s" id="lo">Salir</button>`;
  $("lo").onclick = async () => { await db.auth.signOut().catch(() => {}); Object.keys(localStorage).filter(k => k.startsWith("alc")).forEach(k => localStorage.removeItem(k)); login(); };

// Evaluación: fijos primero; luego orden categoría → prioridad → ordenamiento; compra lo que entra (salteo)
const gk = r => (r.grupo || "").trim().toLowerCase();
function evaluar(P = Number(S.p.valor_inicial)) {
  const co = id => S.cats.find(c => c.id === id)?.orden ?? 999;
  const pn = id => S.pris.find(x => x.id === id)?.nivel ?? 999;
  const lista = [...S.regs].sort((a, b) => co(a.categoria_id) - co(b.categoria_id) || pn(a.prioridad_id) - pn(b.prioridad_id) || a.ordenamiento - b.ordenamiento || a.id - b.id);
  const dura = r => r.fijo || r.comprado;
  let saldo = P - lista.filter(dura).reduce((s, r) => s + Number(r.valor), 0);
  const fijosExceden = saldo < 0;
  const tomado = new Set(lista.filter(r => dura(r) && gk(r)).map(gk));
  lista.forEach(r => {
    r._alt = false;
    if (dura(r)) r._ok = true;
    else if (gk(r) && tomado.has(gk(r))) r._ok = false;
    else if (Number(r.valor) <= saldo) { r._ok = true; saldo -= Number(r.valor); if (gk(r)) tomado.add(gk(r)); }
    else r._ok = false;
  });
  lista.forEach(r => { if (!r._ok && gk(r) && tomado.has(gk(r))) r._alt = true; });
  const comprado = lista.filter(r => r._ok).reduce((s, r) => s + Number(r.valor), 0);
  return { lista, comprado, saldo: P - comprado, fijosExceden };
}

const sum = a => a.reduce((s, r) => s + Number(r.valor), 0);
const liR = a => a.map(r => `<div class="row" style="padding:3px 0"><span class="grow">${esc(r.descripcion) || "(sin descripción)"}</span><b>${money(r.valor)}</b></div>`).join("");

async function moverItem(r, d) {
  const g = S.regs.filter(x => x.categoria_id === r.categoria_id && x.prioridad_id === r.prioridad_id).sort((a, b) => a.ordenamiento - b.ordenamiento);
  const o = g[g.findIndex(x => x.id === r.id) + d]; if (!o) return;
  const rs = await Promise.all([db.from("registro").update({ ordenamiento: o.ordenamiento }).eq("id", r.id), db.from("registro").update({ ordenamiento: r.ordenamiento }).eq("id", o.id)]);
  const er = rs.find(x => x.error); if (er) return fail(er.error);
  close(); openProject(S.p);
}

async function duplicar(p) {

  if (fail(g.error)) return; const n = g.data;
  await Promise.all([db.from("categoria").delete().eq("proyecto_id", n.id), db.from("prioridad").delete().eq("proyecto_id", n.id)]);
  const [cs, ps, rg] = await Promise.all([db.from("categoria").select("*").eq("proyecto_id", p.id).eq("activo", true).order("orden"), db.from("prioridad").select("*").eq("proyecto_id", p.id).eq("activo", true).order("nivel"), db.from("registro").select("*").eq("proyecto_id", p.id).eq("activo", true).order("ordenamiento")]);

  const np = ps.data.length ? await db.from("prioridad").insert(ps.data.map(x => ({ descripcion: x.descripcion, nivel: x.nivel, proyecto_id: n.id, activo: true }))).select() : { data: [] };
  if (fail(nc.error) || fail(np.error)) return;

  const mp = id => { const o = ps.data.find(x => x.id === id); return o ? np.data.find(x => x.descripcion === o.descripcion)?.id ?? null : null; };
  for (const r of rg.data) {

function datosSalida() {
  const e = evaluar(), lista = e.lista, P = Number(S.p.valor_inicial);
  const bought = lista.filter(r => r.comprado), ok = lista.filter(r => r._ok && !r.comprado), no = lista.filter(r => !r._ok);
  const ah = Number(S.p.ahorro_mensual) || 0, cuando = {};
  if (ah > 0) { let cum = 0; no.forEach(r => { if (r._alt || (gk(r) && no.findIndex(x => gk(x) === gk(r)) < no.indexOf(r))) return; cum += Number(r.valor); const m = Math.ceil(Math.max(0, cum - e.saldo) / ah), d = new Date(); d.setMonth(d.getMonth() + m); cuando[r.id] = `~${m} ${m === 1 ? "mes" : "meses"} (${d.toLocaleDateString("es-AR", { month: "short", year: "numeric" })})`; }); }
  const cat = id => S.cats.find(c => c.id === id)?.descripcion || "Sin categoría", pri = id => S.pris.find(x => x.id === id)?.descripcion || "-";
  const pc = {}; lista.filter(r => r._ok).forEach(r => pc[cat(r.categoria_id)] = (pc[cat(r.categoria_id)] || 0) + Number(r.valor));
  const gastado = sum(bought);

}

}

function guessTitulo(u, t) {
  const limpiar = x => x.replace(/\s*[|·–-]\s*(mercado\s?libre|coto digital|cotodigital)[^|]*$/i, "").trim();
  if (t && t.trim()) return limpiar(t);
  try {
    const seg = decodeURIComponent(new URL(u).pathname).split("/").filter(x => /[a-zA-Z]{3}/.test(x) && !/^R-\d/.test(x)).sort((a, b) => b.length - a.length)[0] || "";
    const n = seg.replace(/^ML[A-Z]-?\d+-?/i, "").replace(/-?_JM$/i, "").replace(/[-_]+/g, " ").trim();
    return n && /[-_]/.test(seg) ? n.charAt(0).toUpperCase() + n.slice(1) : new URL(u).hostname.replace("www.", "");
  } catch (e) { return u; }
}

const rel = f => { const m = Math.round((Date.now() - new Date(f)) / 60000); return m < 1 ? "ahora" : m < 60 ? `hace ${m} min` : m < 1440 ? `hace ${Math.round(m / 60)} h` : new Date(f).toLocaleDateString("es-AR"); };

function insights() {
  const e = evaluar(), P = Number(S.p.valor_inicial), L = e.lista, dura = r => r.fijo || r.comprado, out = [];
  const total = sum(L.filter(r => !r._alt)), n = L.filter(r => !r._alt).length, ok = L.filter(r => r._ok);
  out.push(total > P ? `Cargaste <b>${money(total)}</b>, el ${P ? Math.round(total / P * 100) : 0} % del presupuesto. Entran ${ok.length} de ${n} ítems.` : `Todo lo cargado entra y te sobran <b>${money(P - total)}</b>.`);
  const W = L.find(r => !r._ok && !r._alt);
  if (W) {
    out.push(`Te faltan <b>${money(Number(W.valor) - e.saldo)}</b> para «${esc(W.descripcion)}».`);
    const pw = puntos(W), Z = L.filter(r => r._ok && !dura(r) && L.indexOf(r) > L.indexOf(W) && puntos(r) < pw && e.saldo + Number(r.valor) >= Number(W.valor)).sort((a, b) => puntos(a) - puntos(b) || Number(b.valor) - Number(a.valor))[0];
    if (Z) out.push(`💡 Si dejás para después «${esc(Z.descripcion)}» (${money(Z.valor)}), entra «${esc(W.descripcion)}», que es más importante.`);
  }
  const pc = {}; ok.forEach(r => { const c = S.cats.find(x => x.id === r.categoria_id)?.descripcion || "Sin categoría"; pc[c] = (pc[c] || 0) + Number(r.valor); });
  const g = sum(ok), top = Object.entries(pc).sort((a, b) => b[1] - a[1])[0];
  if (top && Object.keys(pc).length > 1 && g && top[1] / g > 0.6) out.push(`El ${Math.round(top[1] / g * 100)} % de lo que comprás va a «${esc(top[0])}».`);
  return `<div class="card"><div class="lbl" style="margin-top:0">💡 Lectura rápida</div>${out.map(t => `<p style="margin:6px 0">${t}</p>`).join("")}</div>`;
}

function plan() {
  const e = evaluar(), ah = Number(S.p.ahorro_mensual) || 0, fl = S.p.fecha_limite ? new Date(S.p.fecha_limite + "T12:00:00") : null;
  if (!ah) return alert("Cargá un ahorro mensual: tocá Editar (arriba) y completá 'Ahorro mensual'.");
  const h0 = new Date(), mesesHasta = fl ? Math.max(0, (fl.getFullYear() - h0.getFullYear()) * 12 + fl.getMonth() - h0.getMonth() - (fl.getDate() < h0.getDate() ? 1 : 0)) : null;
  const tomado = new Set(e.lista.filter(r => r._ok && gk(r)).map(gk)), hoy = e.lista.filter(r => r._ok && !r.comprado);
  let rest = e.lista.filter(r => !r._ok && !r._alt), saldo = e.saldo; const meses = [], vistos = new Set();
  const pendTot = sum(rest.filter(r => { const k = gk(r); if (!k) return true; if (vistos.has(k)) return false; vistos.add(k); return true; }));
  for (let m = 1; m <= 36 && rest.length; m++) {
    saldo += ah; const compras = [];
    rest.slice().forEach(r => { const k = gk(r); if (k && tomado.has(k)) { rest = rest.filter(x => x !== r); return; } if (Number(r.valor) <= saldo) { saldo -= Number(r.valor); compras.push(r); rest = rest.filter(x => x !== r); if (k) tomado.add(k); } });
    if (compras.length) { const d = new Date(); d.setMonth(d.getMonth() + m); meses.push({ m, compras, saldo, d }); }
  }
  const falta = fl && mesesHasta > 0 ? Math.max(0, pendTot - (e.saldo + ah * mesesHasta)) : 0;
  modal(`<h3>📅 Plan de compras</h3><p class="mu">Con ahorro de ${money(ah)} por mes${fl ? ` y fecha límite ${fl.toLocaleDateString("es-AR")}` : ""}.</p>
  ${fl ? `<div class="card">${falta > 0 ? `Para tenerlo todo antes de la fecha te faltan <b>${money(falta)}</b>: unos <b>${money(falta / mesesHasta)}</b> más por mes.` : "✅ Con tu ahorro llegás a tener todo antes de la fecha límite."}</div>` : ""}
  <div class="card"><b>Hoy</b><div class="mu">${hoy.length} ítems con tu presupuesto actual</div>${liR(hoy)}</div>
  ${meses.map(x => `<div class="card"><div class="row"><b class="grow">Mes ${x.m} · ${x.d.toLocaleDateString("es-AR", { month: "short", year: "numeric" })}</b>${fl && x.m > mesesHasta ? `<span class="tag" style="background:var(--no)">Después de la fecha</span>` : ""}</div>${liR(x.compras)}<div class="mu">Saldo después: ${money(x.saldo)}</div></div>`).join("")}
  ${rest.length ? `<div class="card"><b>No entran en 3 años</b>${liR(rest)}</div>` : ""}`, null, "Cerrar");
}

async function abrirLibro(l) {
  S.lib = l; if (!S.mes) S.mes = hoyISO().slice(0, 7);
  const q = t => db.from(t).select("*").eq("libro_id", l.id);
  const [cu, ca, pr, tc, sa] = await Promise.all([q("cuenta").order("id"), q("categoria_fin").order("id"), q("propiedad").order("id"), q("libro_tc"), q("cuenta_saldo")]);
  for (const r of [cu, ca, pr, tc, sa]) if (fail(r.error)) return;
  S.cu = cu.data; S.cf = ca.data; S.pr = pr.data; S.tc = Object.fromEntries(tc.data.map(x => [x.moneda, Number(x.valor)])); S.sal = Object.fromEntries(sa.data.map(x => [x.id, Number(x.saldo)]));
  await cargarMes();
}

async function cargarMes() {
  const [y, m] = S.mes.split("-").map(Number), pad = n => String(n).padStart(2, "0");
  const ini = `${S.mes}-01`, fin = m === 12 ? `${y + 1}-01-01` : `${y}-${pad(m + 1)}-01`, pm = m === 1 ? `${y - 1}-12-01` : `${y}-${pad(m - 1)}-01`;
  const b = () => db.from("movimiento").select("*").eq("libro_id", S.lib.id).eq("activo", true);
  const [a, p] = await Promise.all([b().gte("fecha", ini).lt("fecha", fin).order("fecha", { ascending: false }).order("id", { ascending: false }), b().gte("fecha", pm).lt("fecha", ini)]);
  if (fail(a.error) || fail(p.error)) return;
  S.mv = a.data; S.mvp = p.data; drawLibro();
}

function totales(mv) {
  const falta = new Set(), porCat = {}; let ing = 0, gas = 0;
  mv.forEach(m => {
    const c = S.cu.find(x => x.id === m.cuenta_id); if (!c || m.tipo === "transferencia") return;
    const f = c.moneda === S.lib.moneda ? 1 : S.tc[c.moneda]; if (!f) { falta.add(c.moneda); return; }
    const v = Number(m.monto) * f;
    if (m.tipo === "ingreso") ing += v; else { gas += v; const k = m.categoria_id ?? 0; porCat[k] = (porCat[k] || 0) + v; }
  });
  return { ing, gas, porCat, falta };
}

function drawLibro() {
  const L = S.lib, T = totales(S.mv), TP = totales(S.mvp), mon = n => mm(n, L.moneda), [y, mo] = S.mes.split("-").map(Number);
  const etiq = new Date(y, mo - 1, 1).toLocaleDateString("es-AR", { month: "long", year: "numeric" });
  $("hd").innerHTML = `<button class="s" id="bk">‹</button><h1>${esc(L.nombre)}</h1><button class="s" id="el">⚙︎</button>`;
  const cuentas = S.cu.filter(c => c.activo), cn = id => S.cu.find(c => c.id === id)?.nombre || "", cat = id => S.cf.find(c => c.id === id);
  const tot = cuentas.reduce((s, c) => { const f = c.moneda === L.moneda ? 1 : S.tc[c.moneda]; return f ? s + (S.sal[c.id] || 0) * f : s; }, 0);
  const falta = new Set([...T.falta, ...cuentas.filter(c => c.moneda !== L.moneda && !S.tc[c.moneda]).map(c => c.moneda)]);
  const dg = TP.gas > 0 ? `${T.gas > TP.gas ? "▲" : "▼"} ${Math.abs(Math.round((T.gas / TP.gas - 1) * 100))} % en gastos vs. mes anterior` : "";
  const cats = Object.entries(T.porCat).sort((a, b) => b[1] - a[1]);
  const dias = {}; S.mv.forEach(m => (dias[m.fecha] ||= []).push(m));
  const fila = m => { const c = S.cu.find(x => x.id === m.cuenta_id), k = cat(m.categoria_id), p = S.pr.find(x => x.id === m.propiedad_id), tr = m.tipo === "transferencia";
    const col = m.tipo === "ingreso" ? "var(--ok)" : tr ? "var(--mu)" : "var(--tx)";
    return `<div class="card row" data-mv="${m.id}"><span style="font-size:20px">${tr ? "↔️" : m.tipo === "ingreso" ? "⬆️" : "⬇️"}</span><div class="grow"><b>${esc(m.descripcion || k?.nombre || (tr ? "Transferencia" : "Movimiento"))}</b>
      <div class="mu">${tr ? `${esc(cn(m.cuenta_id))} → ${esc(cn(m.cuenta_destino_id))}` : esc(cn(m.cuenta_id)) + (k ? " · " + esc(k.nombre) : "")}${p ? " · " + esc(p.nombre) : ""}</div></div>
      <b style="color:${col}">${m.tipo === "ingreso" ? "+" : tr ? "" : "−"}${mm(m.monto, c?.moneda)}</b></div>`; };
  $("app").innerHTML = `<div class="row" style="margin-bottom:10px"><button class="s" id="m1">‹</button><b class="grow" style="text-align:center;text-transform:capitalize">${etiq}</b><button class="s" id="m2">›</button></div>
  <div class="kpi"><div class="l">Resultado del mes</div><div class="v">${mon(T.ing - T.gas)}</div><div class="r"><div><span class="l">Ingresos</span><b>${mon(T.ing)}</b></div><div><span class="l">Gastos</span><b>${mon(T.gas)}</b></div></div>${dg ? `<div class="l" style="margin-top:10px">${dg}</div>` : ""}</div>
  ${falta.size ? `<p style="color:var(--no);font-size:14px">⚠ Falta el tipo de cambio de ${[...falta].join(", ")}. Tocá ⚙︎ → Tipo de cambio.</p>` : ""}
  <div class="card"><div class="lbl" style="margin-top:0">Cuentas · ${mon(tot)}</div>
  ${cuentas.map(c => `<div class="row" data-cu="${c.id}" style="padding:8px 0"><span>${ICONO[c.tipo]}</span><div class="grow">${esc(c.nombre)} <span class="mu">${c.moneda}</span></div><b>${mm(S.sal[c.id] || 0, c.moneda)}</b></div>`).join("") || `<p class="mu">Todavía no tenés cuentas.</p>`}
  <button class="s" style="width:100%;margin-top:6px" id="nc2">+ Cuenta</button></div>
  ${cats.length ? `<div class="card"><div class="lbl" style="margin-top:0">Gastos por categoría</div>${cats.map(([id, v]) => { const k = cat(+id); return `<div style="margin-bottom:8px"><div class="row"><span class="dot" style="background:${esc(k?.color || "#94a3b8")}"></span><span class="grow">${esc(k?.nombre || "Sin categoría")}</span><b>${mon(v)}</b><span class="mu">${T.gas ? Math.round(v / T.gas * 100) : 0} %</span></div><div class="bar"><i style="width:${T.gas ? v / T.gas * 100 : 0}%;background:${esc(k?.color || "#94a3b8")}"></i></div></div>`; }).join("")}</div>` : ""}
  ${Object.keys(dias).length ? Object.entries(dias).map(([d, a]) => `<div class="lbl">${new Date(d + "T12:00:00").toLocaleDateString("es-AR", { weekday: "short", day: "numeric", month: "short" })}</div>${a.map(fila).join("")}`).join("") : `<p class="mu">No hay movimientos en este mes.</p>`}
  <button class="fab" id="nm">+ Movimiento</button>`;
  $("bk").onclick = finHome; $("el").onclick = libroMenu; $("nc2").onclick = () => cuentaForm(); $("nm").onclick = () => movForm();
  const mes = d => { const x = new Date(y, mo - 1 + d, 1); S.mes = x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0"); cargarMes(); };

// Puntaje de un ítem: 1 + peso de prioridad + peso de categoría (Alta e Incorporación pesan más)
function puntos(r) {
  const cr = [...S.cats].sort((a, b) => a.orden - b.orden), pr = [...S.pris].sort((a, b) => a.nivel - b.nivel);
  const ci = cr.findIndex(c => c.id === r.categoria_id), pi = pr.findIndex(p => p.id === r.prioridad_id);
  return 1 + (ci < 0 ? 0 : cr.length - ci) + (pi < 0 ? 0 : pr.length - pi);
}

// ===== Alternativas de compra (estilo Solver) =====
// Unidades: los ítems con el mismo "grupo" son opciones de una misma necesidad (se compra una sola)
function unidades(a) {
  const m = new Map(), out = [];
  a.forEach(r => { const k = gk(r); if (!k) out.push([r]); else if (m.has(k)) m.get(k).push(r); else { const u = [r]; m.set(k, u); out.push(u); } });
  return out;
}

// Más ítems: máxima cantidad posible; entre las opciones empatadas, la que mejor respeta tu orden.
function masItems(U, cap) {
  const mc = U.map(u => Math.min(...u.map(r => Number(r.valor)))), asc = [...mc].sort((a, b) => a - b);
  let K = 0, t = 0; for (const c of asc) { if (t + c > cap) break; t += c; K++; }
  const sel = new Set(); let resto = cap, need = K;
  for (let i = 0; i < U.length && need > 0; i++) {
    const later = mc.slice(i + 1).sort((a, b) => a - b).slice(0, need - 1), ls = later.reduce((a, b) => a + b, 0);
    if (later.length < need - 1) continue;
    const o = U[i].find(r => Number(r.valor) + ls <= resto);
    if (o) { sel.add(o.id); resto -= Number(o.valor); need--; }
  }
  return sel;
}

// Máximo puntaje: mochila exacta con opciones (una por necesidad); a igual puntaje, menor gasto.
function maxPuntaje(U, cap) {
  const V = U.reduce((s, u) => s + Math.max(...u.map(puntos)), 0), dp = [new Array(V + 1).fill(Infinity)]; dp[0][0] = 0;
  U.forEach((u, i) => { const p = dp[i], n = p.slice(); u.forEach(r => { const v0 = puntos(r), c = Number(r.valor); for (let v = v0; v <= V; v++) if (p[v - v0] + c < n[v]) n[v] = p[v - v0] + c; }); dp.push(n); });
  let best = 0; for (let v = V; v >= 0; v--) if (dp[U.length][v] <= cap) { best = v; break; }
  const ids = new Set();
  for (let i = U.length, v = best; i > 0; i--) if (dp[i][v] !== dp[i - 1][v]) { const o = U[i - 1].find(r => dp[i - 1][v - puntos(r)] + Number(r.valor) === dp[i][v]); if (o) { ids.add(o.id); v -= puntos(o); } }
  return ids;
}

// Aprovechar presupuesto: gastar lo más cerca posible del tope (costos redondeados hacia arriba: nunca se pasa).
function maxGasto(U, cap) {
  if (cap <= 0 || !U.length) return new Set();
  const g = Math.max(1, cap / 20000), W = Math.floor(cap / g + 1e-9), take = U.map(() => new Uint8Array(W + 1)), dp = new Float64Array(W + 1), w = r => Math.ceil(Number(r.valor) / g - 1e-9);
  U.forEach((u, i) => { const prev = dp.slice(); u.forEach((r, k) => { const wr = w(r), c = Number(r.valor) * 1e6 + 1; for (let j = wr; j <= W; j++) { const v = prev[j - wr] + c; if (v > dp[j]) { dp[j] = v; take[i][j] = k + 1; } } }); });
  const sel = new Set(); for (let i = U.length - 1, j = W; i >= 0; i--) if (take[i][j]) { const r = U[i][take[i][j] - 1]; sel.add(r.id); j -= w(r); }
  return sel;
}

function alternativas() {
  const e = evaluar(), dura = r => r.fijo || r.comprado, fijos = e.lista.filter(dura), tom = new Set(fijos.filter(r => gk(r)).map(gk)), libres = unidades(e.lista.filter(r => !dura(r) && !(gk(r) && tom.has(gk(r)))));
  const P = Number(S.p.valor_inicial), cap = P - sum(fijos);
  if (cap < 0) return null;
  const actual = new Set(e.lista.filter(r => r._ok).map(r => r.id)), con = ids => new Set([...fijos.map(r => r.id), ...ids]);
  const defs = [["Tu orden", "Respeta tu orden: compra lo que entra, de arriba hacia abajo.", actual],
    ["Más ítems", "La mayor cantidad posible, priorizando los primeros de tu orden.", con(masItems(libres, cap))],
    ["Máximo puntaje", "Prioriza lo más importante (prioridad y categoría).", con(maxPuntaje(libres, cap))],
    ["Aprovechar presupuesto", "Gasta lo más cerca posible del presupuesto.", con(maxGasto(libres, cap))]];
  const alts = [];
  defs.forEach(([n, d, ids], i) => { const k = [...ids].sort().join(","), f = alts.find(a => a.k === k); if (f) { f.nombres.push(n); f.descs.push(d); } else alts.push({ k, nombres: [n], descs: [d], ids, esActual: i === 0 }); });
  alts.forEach(a => { const sel = e.lista.filter(r => a.ids.has(r.id)); a.n = sel.length; a.pts = sel.reduce((s, r) => s + puntos(r), 0); a.gasto = sum(sel); a.saldo = P - a.gasto;
    a.entran = e.lista.filter(r => a.ids.has(r.id) && !actual.has(r.id)); a.salen = e.lista.filter(r => !a.ids.has(r.id) && actual.has(r.id)); a.badges = []; });
  if (alts.length > 1) { const mx = k => Math.max(...alts.map(a => a[k]));
    alts.forEach(a => { if (a.n === mx("n")) a.badges.push("🏆 más ítems"); if (a.pts === mx("pts")) a.badges.push("🏆 más puntaje"); if (a.gasto === mx("gasto")) a.badges.push("🏆 mejor uso"); }); }
  return { P, alts };
}

const T = { c: { tabla: "categoria", campo: "orden", S: () => S.cats, n: "categoría" }, p: { tabla: "prioridad", campo: "nivel", S: () => S.pris, n: "prioridad" } };

    <div class="grow">${esc(x.descripcion)}</div>
    <button class="s" data-up="${t}${x.id}" ${i === 0 ? "disabled" : ""}>▲</button><button class="s" data-dn="${t}${x.id}" ${i === n - 1 ? "disabled" : ""}>▼</button><button class="s" data-ed="${t}${x.id}">✏️</button></div>`;
  const sec = t => { const a = T[t].S().filter(x => x.activo); return a.map((x, i) => fila(t, x, i, a.length)).join("") || `<p class="mu">Sin ${T[t].n}s todavía.</p>`; };
  modal(`<h3>Categorías y prioridades</h3><p class="mu">De arriba hacia abajo: lo primero se compra primero.</p>
  <div class="lbl">Categorías</div>${sec("c")}<button class="s" style="width:100%" id="nc">+ Categoría</button>
  <div class="lbl">Prioridades (1 = más alta)</div>${sec("p")}<button class="s" style="width:100%" id="np2">+ Prioridad</button>`, null, "Cerrar");
  const get = v => ({ t: v[0], id: Number(v.slice(1)) });
  document.querySelectorAll("[data-up]").forEach(b => b.onclick = () => { const g = get(b.dataset.up); mover(g.t, g.id, -1); });
  document.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => { const g = get(b.dataset.dn); mover(g.t, g.id, 1); });
  document.querySelectorAll("[data-ed]").forEach(b => b.onclick = () => { const g = get(b.dataset.ed); itemForm(g.t, T[g.t].S().find(x => x.id === g.id)); });
  $("nc").onclick = () => itemForm("c"); $("np2").onclick = () => itemForm("p");
}

async function refrescarConfig() { await loadCats(S.p.id); drawProject(); config(); }

async function mover(t, id, d) {
  const a = T[t].S().filter(x => x.activo), i = a.findIndex(x => x.id === id), j = i + d;
  if (j < 0 || j >= a.length) return;
  [a[i], a[j]] = [a[j], a[i]];
  const rs = await Promise.all(a.map((x, k) => db.from(T[t].tabla).update({ [T[t].campo]: k + 1 }).eq("id", x.id)));
  const er = rs.find(r => r.error); if (er) return fail(er.error);
  refrescarConfig();
}

function itemForm(t, x) {
  const c = t === "c", m = T[t];
  modal(`<h3>${x ? "Editar" : "Nueva"} ${m.n}</h3><label>Nombre</label><input id="nm" value="${esc(x?.descripcion)}">
  ${c ? `<label>Color</label><input id="co" type="color" value="${esc(x?.color || "#2563eb")}" style="height:48px;padding:4px">` : ""}
  <div class="row"><button class="grow" id="ok">Guardar</button>${x ? `<button class="d" id="del">Eliminar</button>` : ""}</div>`, config, "Volver");
  $("ok").onclick = async () => {
    const d = $("nm").value.trim(); if (!d) return alert("Falta el nombre");
    const o = { descripcion: d }; if (c) o.color = $("co").value;
    let r;
    if (x) r = await db.from(m.tabla).update(o).eq("id", x.id);
    else { const mx = Math.max(0, ...m.S().map(a => a[m.campo])); r = await db.from(m.tabla).insert({ ...o, [m.campo]: mx + 1, proyecto_id: S.p.id, activo: true }); }
    if (!fail(r.error)) refrescarConfig();
  };
  if (x) $("del").onclick = async () => {
    if (!confirm("¿Eliminar? Los ítems que ya la usan la conservan, pero no podrás elegirla en ítems nuevos.")) return;
    const r = await db.from(m.tabla).update({ activo: false }).eq("id", x.id);
    if (!fail(r.error)) refrescarConfig();
  };
}
function close() { $("modal").innerHTML = ""; }

window.addEventListener("online", () => { $("off").hidden = true; });
window.addEventListener("offline", () => { $("off").hidden = false; });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
document.addEventListener("visibilitychange", () => { if (!document.hidden && S.uid) contarNotif(); });
init();
</script>
